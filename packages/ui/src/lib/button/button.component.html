<button
  class="ds-button"
  [class.ds-button--fill]="variant() === 'fill'"
  [class.ds-button--outline]="variant() === 'outline'"
  [class.ds-button--text]="variant() === 'text'"
  [class.ds-button--primary]="color() === 'primary'"
  [class.ds-button--secondary]="color() === 'secondary'"
  [class.ds-button--success]="color() === 'success'"
  [class.ds-button--danger]="color() === 'danger'"
  [class.ds-button--warning]="color() === 'warning'"
  [class.ds-button--color-outline]="color() === 'outline'"
  [class.ds-button--lg]="size() === 'lg'"
  [class.ds-button--sm]="size() === 'sm'"
  [disabled]="disabled()"
  (click)="onClick($event)"
>
  <ng-content />
</button>
